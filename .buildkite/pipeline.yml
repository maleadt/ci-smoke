# sandboxed-buildkite-agent#187 (6d7d6de): `sba stop` while Linux, Windows and
# FreeBSD jobs run; the Windows launcher fix should get agent_stop recorded.
# Each hold passes at once when retried.
steps:
  - label: "linux hold"
    command: "bash .buildkite/hold.sh"
    timeout_in_minutes: 30
    agents: {queue: "default", pool: "sba-linux", sched_cpus: "2", sched_mem_gib: "4"}
  - label: "windows hold"
    command: "bash .buildkite/hold.sh"
    timeout_in_minutes: 30
    agents: {queue: "default", pool: "sba-win", sched_cpus: "4", sched_mem_gib: "8"}
  - label: "freebsd hold"
    command: "bash .buildkite/hold.sh"
    timeout_in_minutes: 30
    agents: {queue: "default", pool: "sba-bsd", sched_cpus: "2", sched_mem_gib: "4"}

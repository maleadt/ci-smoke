# sandboxed-buildkite-agent tb/sba-rename (97dbe1b): `sba stop` while Linux,
# Windows and FreeBSD jobs run, and while a Windows guest is still booting
# ("late", released by "gate"). Each hold passes at once when retried.
steps:
  - label: "linux hold"
    command: "bash .buildkite/hold.sh"
    timeout_in_minutes: 30
    agents: {queue: "default", pool: "sba-linux", sched_cpus: "2", sched_mem_gib: "4"}
  - label: "windows hold"
    command: "bash .buildkite/hold.sh"
    timeout_in_minutes: 30
    agents: {queue: "default", pool: "sba-win", sched_cpus: "4", sched_mem_gib: "8"}
  - label: "freebsd hold"
    command: "bash .buildkite/hold.sh"
    timeout_in_minutes: 30
    agents: {queue: "default", pool: "sba-bsd", sched_cpus: "2", sched_mem_gib: "4"}
  - label: "gate"
    key: "gate"
    command: "sleep 120"
    timeout_in_minutes: 10
    agents: {queue: "default", pool: "sba-linux"}
  - label: "windows late (booting at the stop)"
    depends_on: "gate"
    command: "bash .buildkite/hold.sh"
    env: {HOLD_SECONDS: "30", HOLD_PASS: "1"}
    timeout_in_minutes: 30
    agents: {queue: "default", pool: "sba-win", sched_cpus: "4", sched_mem_gib: "8"}

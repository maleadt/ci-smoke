# Per-queue defaults for untagged jobs (sandboxed-buildkite-agent#181 at 921b6f0).
# Linux (pegasus, pool=sized): [linux.default.default] = 4 cpus / 6 threads / 4 GiB,
# total_cpus = 16.
# Expected:
#   untagged    -> JULIA_CPU_THREADS = OMP_THREAD_LIMIT = nproc = 6, memory.max 4 GiB
#   untagged-oom-> OOM-killed under the default's 4 GiB (soft fail)
#   partial     -> failed by the scheduler with a message, never falls back (soft fail)
#   tagged      -> 8 / 8 / 2: tags override the default
#   stop        -> untagged; stopped by `bk stop`, retried by Buildkite, passes
env:
  PROBE: >-
    echo "agent=$$BUILDKITE_AGENT_NAME";
    echo "JULIA_CPU_THREADS=$$JULIA_CPU_THREADS OMP_THREAD_LIMIT=$${OMP_THREAD_LIMIT:-unset} nproc=$$(nproc)";
    echo "memory.max=$$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)";
    echo "retry=$$BUILDKITE_RETRY_COUNT"
steps:
  - label: "untagged"
    command: "eval \"$$PROBE\"; sleep 30"
    agents: {queue: "default", pool: "sized"}
  - label: "untagged-oom"
    command: "eval \"$$PROBE\"; x=$$(head -c 6G /dev/zero | tr '\\0' a); echo survived $${#x}"
    agents: {queue: "default", pool: "sized"}
    soft_fail: true
  - label: "partial"
    command: "echo should not run; exit 1"
    agents: {queue: "default", pool: "sized", sched_cpus: "4"}
    soft_fail: true
  - label: "tagged"
    command: "eval \"$$PROBE\"; sleep 10"
    agents: {queue: "default", pool: "sized", sched_cpus: "8", sched_threads: "8", sched_mem_gib: "2"}
  - label: "stop"
    command: "eval \"$$PROBE\"; if [ \"$$BUILDKITE_RETRY_COUNT\" = 0 ]; then sleep 900; fi"
    agents: {queue: "default", pool: "sized"}
    retry:
      automatic:
        - exit_status: -1
          signal_reason: agent_stop
          limit: 1

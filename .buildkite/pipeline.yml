# sandboxed-buildkite-agent#187 (tb/job-memory-fixes 3eb012a) resource records:
# a known load (2 busy CPUs, 1 GiB held, 30 s) on every platform, and an OOM.
steps:
  - label: "linux load (+1 GiB written)"
    command: "bash .buildkite/load.sh"
    env: {LOAD_WRITE_MIB: "1024"}
    timeout_in_minutes: 15
    agents: {queue: "default", pool: "sba-linux", sched_cpus: "2", sched_cpus_limit: "4", sched_mem_gib: "4"}
  - label: "linux oom (limit 1 GiB, allocates 3 GiB)"
    command: "echo start; x=$$(head -c 3G /dev/zero | tr '\\0' a); echo survived $${#x}"
    soft_fail: true
    timeout_in_minutes: 15
    agents: {queue: "default", pool: "sba-linux", sched_cpus: "1", sched_mem_gib: "1"}
  - label: "windows load"
    command: "bash .buildkite/load.sh"
    timeout_in_minutes: 20
    agents: {queue: "default", pool: "sba-win", sched_cpus: "4", sched_mem_gib: "8"}
  - label: "freebsd load"
    command: "bash .buildkite/load.sh"
    timeout_in_minutes: 20
    agents: {queue: "default", pool: "sba-bsd", sched_cpus: "4", sched_mem_gib: "8"}

# Fast scheduler stop and automatic retry (sandboxed-buildkite-agent tb/fast-stop,
# julia-buildkite tb/retry-agent-lost). Run against a scheduler whose group advertises
# pool=fast-stop. Expected:
# - "stop" and "stop-slow-cancel" are stopped by a scheduler stop request within seconds
#   (the latter ignores its cancel signal for 10 minutes, like Julia's test runner dumping
#   cores), finish with signal_reason agent_stop, and pass on their retry;
# - "lost" has its agent SIGKILLed by hand, is marked lost by Buildkite (exit -1, no signal
#   reason) and passes on its retry.
env:
  PROBE: >-
    echo "agent=$$BUILDKITE_AGENT_NAME retry=$$BUILDKITE_RETRY_COUNT";
    date -u +%FT%TZ
steps:
  - label: "stop"
    command: "eval \"$$PROBE\"; if [ \"$$BUILDKITE_RETRY_COUNT\" = 0 ]; then sleep 900; fi"
    agents: {queue: "default", pool: "fast-stop", sched_cpus: "2", sched_threads: "2", sched_mem_gib: "2"}
    retry: &retry_rules
      automatic:
        - exit_status: -1
          signal_reason: [none, agent_stop]
          limit: 1
        - exit_status: "*"
          signal_reason: agent_stop
          limit: 1
  - label: "stop-slow-cancel"
    command: "eval \"$$PROBE\"; trap 'echo got SIGQUIT, dumping cores for 10 minutes; sleep 600' QUIT; if [ \"$$BUILDKITE_RETRY_COUNT\" = 0 ]; then sleep 900 & wait; sleep 900; fi"
    env:
      BUILDKITE_CANCEL_SIGNAL: "SIGQUIT"
    agents: {queue: "default", pool: "fast-stop", sched_cpus: "2", sched_threads: "2", sched_mem_gib: "2"}
    retry: *retry_rules
  - label: "lost"
    command: "eval \"$$PROBE\"; if [ \"$$BUILDKITE_RETRY_COUNT\" = 0 ]; then sleep 1800; fi"
    agents: {queue: "default", pool: "fast-stop", sched_cpus: "2", sched_threads: "2", sched_mem_gib: "2"}
    retry: *retry_rules

# Windows worker images without Docker (sandboxed-buildkite-agent tb/remove-docker-windows),
# run by a real agent on a KVM Windows worker: image checks, then julia-buildkite main's
# build_windows.yml step (toolchain tree installed into the julia plugin's depot), a warm job
# and a cancel. One slot, so all jobs share one cache pool and each boots a fresh OS overlay.
#
# The build stops at the S3 staging upload: there is no staging role for ci-smoke.
env:
  JULIA_BUILDKITE_COMMIT: "e973bae5430d49eda0c97cf3f86eee576c2c5739"
  JULIA_COMMIT: "b2052f278a83861f09bd4c05e683132adbfd201a"
  SBA_BRANCH: "tb/remove-docker-windows"

steps:
  - label: ":windows: image checks"
    key: "checks"
    commands: |
      set -euo pipefail
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File .buildkite/image-checks.ps1 write
      echo "--- sba guest-side tests"
      git clone -q --depth 1 -b "$${SBA_BRANCH}" https://github.com/JuliaCI/sandboxed-buildkite-agent.git sba
      git -C sba log -1 --oneline
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File sba/platforms/tests/test_windows_cache.ps1
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File sba/platforms/tests/test_windows_network.ps1
    timeout_in_minutes: 20
    agents:
      queue: "default"
      os: "windows"
      arch: "x86_64"

  - label: ":windows: build x86_64-w64-mingw32 (cold toolchain)"
    key: "build"
    depends_on: "checks"
    allow_dependency_failure: true
    plugins:
      - JuliaCI/julia#v1:
          persist_depot_dirs: packages,artifacts,compiled
          update_registry: false
          version: '1.10'
    commands: |
      set -euo pipefail
      echo "--- Check out julia and julia-buildkite"
      git clone -q --filter=blob:none --no-checkout https://github.com/JuliaLang/julia.git julia-src
      git -C julia-src checkout -q "$${JULIA_COMMIT}"
      git clone -q --filter=blob:none --no-checkout https://github.com/JuliaCI/julia-buildkite.git julia-src/.buildkite
      git -C julia-src/.buildkite checkout -q "$${JULIA_BUILDKITE_COMMIT}"
      cd julia-src
      # From here on: the commands of julia-buildkite's build_windows.yml
      echo "--- Install the toolchain"
      TOOLCHAIN="$$(julia --startup-file=no .buildkite/utilities/windows/install_toolchain.jl \
                      "package_windows.x86_64.v8.14" "c1ee19169e6c3ddc16a28d609a00245aa5241a78")"
      unset JULIA_DEPOT_PATH
      bash .buildkite/utilities/windows/toolchain.sh --root "$${TOOLCHAIN}" .buildkite/utilities/build_julia.sh
    timeout_in_minutes: 150
    agents:
      queue: "default"
      os: "windows"
      arch: "x86_64"
    env:
      TRIPLET: "x86_64-w64-mingw32"
      # build_windows.arches of julia-buildkite main, plus what julia-pr builds get (no HTML manual)
      MAKE_FLAGS: "VERBOSE=1,JL_CFLAGS=-Werror -Wno-error=array-bounds -Wno-error=array-bounds= -Wno-error=infinite-recursion,JL_CXXFLAGS=-Werror -Wno-error=array-bounds -Wno-error=array-bounds= -Wno-error=infinite-recursion,JULIA_INSTALL_DOCS=0"
      JULIA_CI_BUILD_MODE: ""

  - label: ":windows: warm toolchain, environment"
    key: "warm"
    depends_on: "build"
    allow_dependency_failure: true
    plugins:
      - JuliaCI/julia#v1:
          persist_depot_dirs: packages,artifacts,compiled
          update_registry: false
          version: '1.10'
    commands: |
      set -euo pipefail
      git clone -q --filter=blob:none --no-checkout https://github.com/JuliaCI/julia-buildkite.git .jb
      git -C .jb checkout -q "$${JULIA_BUILDKITE_COMMIT}"
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File .buildkite/image-checks.ps1 read
      echo "--- Install the toolchain (expect no download)"
      start=$$(date +%s)
      TOOLCHAIN="$$(julia --startup-file=no .jb/utilities/windows/install_toolchain.jl \
                      "package_windows.x86_64.v8.14" "c1ee19169e6c3ddc16a28d609a00245aa5241a78")"
      echo "installed at $${TOOLCHAIN} in $$(( $$(date +%s) - start )) s"
      PLUGIN_DEPOT_PATH="$${JULIA_DEPOT_PATH}"
      unset JULIA_DEPOT_PATH
      echo "--- Inside the toolchain"
      bash .jb/utilities/windows/toolchain.sh --root "$${TOOLCHAIN}" bash -c '
        set -euo pipefail
        echo "gcc: $$(command -v gcc) $$(gcc -dumpversion)"
        echo "make: $$(command -v make)"
        echo "MSYSTEM=$$MSYSTEM HOME=$$HOME TMP=$$TMP"
        echo "COMSPEC=$$COMSPEC"
        echo "BUILDKITE_JOB_ID=$$BUILDKITE_JOB_ID BUILDKITE_PIPELINE_SLUG=$$BUILDKITE_PIPELINE_SLUG"
        echo "aws: $$(command -v aws || echo missing) $$(aws --version 2>&1 || true)"
        echo "buildkite-agent: $$(command -v buildkite-agent)"
        echo "uploaded from the toolchain environment" > toolchain-upload.txt
        buildkite-agent artifact upload toolchain-upload.txt
        exit 3
      ' || status=$$?
      echo "toolchain.sh exit status: $${status:-0} (expected 3)"
      [[ "$${status:-0}" == 3 ]]
      echo "--- The tree is unmodified"
      JULIA_DEPOT_PATH="$${PLUGIN_DEPOT_PATH}" julia --startup-file=no -e 'using Pkg.Artifacts; v = verify_artifact(Base.SHA1("c1ee19169e6c3ddc16a28d609a00245aa5241a78")); println("verify_artifact: ", v); v || exit(1)'
    timeout_in_minutes: 20
    agents:
      queue: "default"
      os: "windows"
      arch: "x86_64"

  - label: ":windows: cancel inside the toolchain"
    key: "cancel"
    depends_on: "warm"
    allow_dependency_failure: true
    plugins:
      - JuliaCI/julia#v1:
          persist_depot_dirs: packages,artifacts,compiled
          update_registry: false
          version: '1.10'
    commands: |
      set -euo pipefail
      git clone -q --filter=blob:none --no-checkout https://github.com/JuliaCI/julia-buildkite.git .jb
      git -C .jb checkout -q "$${JULIA_BUILDKITE_COMMIT}"
      TOOLCHAIN="$$(julia --startup-file=no .jb/utilities/windows/install_toolchain.jl \
                      "package_windows.x86_64.v8.14" "c1ee19169e6c3ddc16a28d609a00245aa5241a78")"
      unset JULIA_DEPOT_PATH
      bash .jb/utilities/windows/toolchain.sh --root "$${TOOLCHAIN}" bash -c 'echo "CANCEL-ME: sleeping in the toolchain, pid $$$$"; sleep 900; echo "not cancelled"'
    timeout_in_minutes: 20
    agents:
      queue: "default"
      os: "windows"
      arch: "x86_64"

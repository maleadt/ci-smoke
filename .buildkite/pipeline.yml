# Server 2025 worker image: InteractiveUtils' empty-clipboard test (fails in ci-smoke 295).
steps:
  - label: ":windows: empty clipboard"
    plugins:
      - JuliaCI/julia#v1:
          version: '1.10'
          update_registry: false
    commands: |
      julia --startup-file=no .buildkite/clipboard.jl
    timeout_in_minutes: 15
    agents:
      queue: "default"
      os: "windows"
      arch: "x86_64"

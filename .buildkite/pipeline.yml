# sandboxed-buildkite-agent tb/sba-rename (97dbe1b) end-to-end checks on pegasus.
# Every step carries a pool tag only the sba-smoke scheduler's groups advertise.
steps:
  - label: "old-name sched_threads (must fail with rename message)"
    command: "echo should not run; exit 1"
    soft_fail: true
    timeout_in_minutes: 10
    agents: {queue: "default", pool: "sba-linux", sched_cpus: "2", sched_threads: "2", sched_mem_gib: "2"}
  - label: "typo sched_mem_limt_gib (must fail naming the key)"
    command: "echo should not run; exit 1"
    soft_fail: true
    timeout_in_minutes: 10
    agents: {queue: "default", pool: "sba-linux", sched_cpus: "2", sched_mem_gib: "2", sched_mem_limt_gib: "4"}
  - label: "linux cpus (limit 3)"
    command: "bash .buildkite/cpus.sh"
    env: {EXPECT_CPUS: "3"}
    timeout_in_minutes: 15
    agents: {queue: "default", pool: "sba-linux", sched_cpus: "2", sched_cpus_limit: "3", sched_mem_gib: "4"}
  - label: "linux cpus (untagged, default 1/2)"
    command: "bash .buildkite/cpus.sh"
    env: {EXPECT_CPUS: "2"}
    timeout_in_minutes: 15
    agents: {queue: "default", pool: "sba-linux"}
  - label: "windows short (tagged)"
    command: "echo \"hello from $$BUILDKITE_AGENT_NAME\"; nproc; sleep 3"
    timeout_in_minutes: 20
    agents: {queue: "default", pool: "sba-win", sched_cpus: "2", sched_cpus_limit: "4", sched_mem_gib: "4", sched_mem_limit_gib: "8"}
  - label: "freebsd short (untagged)"
    command: "echo \"hello from $$BUILDKITE_AGENT_NAME\"; sysctl -n hw.ncpu; sleep 3"
    timeout_in_minutes: 20
    agents: {queue: "default", pool: "sba-bsd"}

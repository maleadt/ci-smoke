# CPU affinity for every Linux job (sandboxed-buildkite-agent f841da8).
# pegasus default: 4 cpus / 6 threads. Expect both steps to see 6 CPUs, disjoint.
env:
  PROBE: >-
    echo "agent=$$BUILDKITE_AGENT_NAME";
    grep Cpus_allowed_list /proc/self/status;
    echo "nproc=$$(nproc) nproc_all=$$(env -u OMP_THREAD_LIMIT nproc) JULIA_CPU_THREADS=$$JULIA_CPU_THREADS";
    sh -c 'grep Cpus_allowed_list /proc/self/status'
steps:
  - label: "limited"
    command: "eval \"$$PROBE\""
    agents: {queue: "default", pool: "sized", cpuset_limited: "true"}
  - label: "unpinned"
    command: "eval \"$$PROBE\""
    agents: {queue: "default", pool: "sized"}

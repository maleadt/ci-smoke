# The "more than 6 vCPUs trips the virtio NIC bug" note in julia-buildkite's
# build_windows.yml: fresh Windows guests at 6, 8 and 12 vCPUs (sched_cpus_limit), each
# timing DHCP/DNS readiness, two 700 MiB downloads and a julia clone.
steps:
  - label: ":windows: NIC at 6 vCPUs (%n)"
    parallelism: 2
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .buildkite/nic-check.ps1
    timeout_in_minutes: 20
    agents: {queue: "default", os: "windows", arch: "x86_64", sched_cpus: "6", sched_cpus_limit: "6"}
  - label: ":windows: NIC at 8 vCPUs (%n)"
    parallelism: 2
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .buildkite/nic-check.ps1
    timeout_in_minutes: 20
    agents: {queue: "default", os: "windows", arch: "x86_64", sched_cpus: "8", sched_cpus_limit: "8"}
  - label: ":windows: NIC at 12 vCPUs (%n)"
    parallelism: 2
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .buildkite/nic-check.ps1
    timeout_in_minutes: 20
    agents: {queue: "default", os: "windows", arch: "x86_64", sched_cpus: "12", sched_cpus_limit: "12"}

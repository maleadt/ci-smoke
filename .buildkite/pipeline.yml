# macOS whole-host group (sandboxed-buildkite-agent#181 at 4d784e9), gemini, total_cpus = 4.
# Expected: both jobs get JULIA_CPU_THREADS = nproc = 4, tags ignored; "mac-stop" is
# stopped by a scheduler stop request and retried by Buildkite.
env:
  PROBE: >-
    echo "agent=$$BUILDKITE_AGENT_NAME";
    echo "JULIA_CPU_THREADS=$$JULIA_CPU_THREADS nproc=$$(nproc 2>/dev/null || echo n/a) hw.logicalcpu=$$(sysctl -n hw.logicalcpu)";
    echo "retry=$$BUILDKITE_RETRY_COUNT"
steps:
  - label: "mac-untagged"
    command: "eval \"$$PROBE\"; sleep 5"
    agents: {queue: "default", pool: "mac"}
  - label: "mac-tagged"
    command: "eval \"$$PROBE\"; sleep 5"
    agents: {queue: "default", pool: "mac", sched_cpus: "1", sched_threads: "1", sched_mem_gib: "1"}
  - label: "mac-stop"
    command: "eval \"$$PROBE\"; if [ \"$$BUILDKITE_RETRY_COUNT\" = 0 ]; then sleep 900; fi"
    agents: {queue: "default", pool: "mac"}
    retry:
      automatic:
        - exit_status: -1
          signal_reason: agent_stop
          limit: 1
